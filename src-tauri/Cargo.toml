[package]
name = "routedeck"
version = "0.6.0"
license = "GPL-3.0-only"
description = "RouteDeck: lightweight cross-platform Mihomo desktop client"
authors = ["cmmuu"]
edition = "2021"
default-run = "routedeck"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "routedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
futures-util = "0.3"
rand = "0.9"
regex = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread", "net", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
sysinfo = "0.39.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinInet", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
fontdue = "0.9.4"
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
