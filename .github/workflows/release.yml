name: Release bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-bundles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-aarch64
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - os: macos-15-intel
            artifact: macos-x64
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - os: windows-2025
            artifact: windows-x64
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - os: windows-11-arm
            artifact: windows-arm64
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-24.04
            artifact: linux-x64
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: npm ci
      - run: npm run test:branding
      - run: npm run test:licenses
      - run: npm run test:theme
      - run: npm run test:rules
      - run: npm run core:prepare
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  publish:
    needs: bundle
    if: github.repository == 'CMMUU/mihomo-codex' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Test release publisher
        run: python3 -m unittest discover -s scripts -p 'test_publish_github_release.py'
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release-artifacts
      - name: Generate and verify compliance assets, then publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          python3 scripts/publish_github_release.py
          --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          --artifacts "$RUNNER_TEMP/release-artifacts"
          --output "$RUNNER_TEMP/release-assets" --apply
